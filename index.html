<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>CIEEE MAU SIDANGGG</title>
  <link rel="icon" type="image/x-icon" href="pala.png">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Bellefair&family=Great+Vibes&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Jersey+20&family=Monsieur+La+Doulaise&family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&display=swap"
    rel="stylesheet" />

  <style>
    /* =========================
       RESET + GLOBAL
    ========================= */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --pad: clamp(16px, 4vw, 64px);
      --radius: 12px;
      --shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
      --glass: rgba(39, 69, 97, 0.72);
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      scroll-behavior: smooth;
      overflow-x: hidden;
    }

    body {
      background: linear-gradient(#27456179, #0000004e),
        url("bgg.jpg") no-repeat center / cover;
      background-attachment: fixed;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: white;
    }

    @media (max-width: 768px) {
      body {
        background-attachment: scroll;
      }
    }

    .hidden {
      display: none !important;
    }

    .container {
      width: min(900px, 94vw);
      margin-inline: auto;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* =========================
       HERO
    ========================= */
    .hero-section {
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--pad) 0;
    }

    /* INTRO reveal */
    .initial-blur {
      filter: blur(18px);
      opacity: 0;
      transform: translateY(34px);
      animation: introReveal 1.1s cubic-bezier(.25, .9, .2, 1) forwards;
    }

    /* khusus photos: blur lebih lama */
    .initial-blur-photos {
      filter: blur(18px);
      opacity: 0;
      transform: translateY(34px);
      animation: introReveal 2.6s cubic-bezier(.25, .9, .2, 1) forwards;
    }

    @keyframes introReveal {
      to {
        filter: blur(0);
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* fade out for hero when switching "page" */
    .fade-away {
      opacity: 0;
      transform: translateY(-10px);
      transition: opacity .55s ease, transform .55s ease;
      pointer-events: none;
    }

    /* STEP 1: sealed */
    .sealed-img {
      width: min(820px, 40vw);
      height: auto;
      cursor: pointer;
      transition: transform 0.3s ease;
      border-radius: 10px;
      box-shadow: var(--shadow);
      user-select: none;
      -webkit-user-drag: none;
    }

    .sealed-img:hover {
      transform: scale(1.03);
    }

    /* =========================
       STEP 2: opened envelope assembly
    ========================= */
    .envelope-assembly {
      position: relative;
      width: 50%;
      height: min(640px, 78vh);
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }

    .env-layer {
      position: absolute;
      width: 100%;
      bottom: 0;
      user-select: none;
      -webkit-user-drag: none;
    }

    .env-back {
      z-index: 1;
    }

    .env-front {
      z-index: 3;
      pointer-events: none;
    }

    .env-drop .env-layer {
      transform: translateY(60px);
      transition: transform 0.65s cubic-bezier(0.25, 0.1, 0.25, 1);
    }

    /* Letter container */
    .letter-container {
      position: absolute;
      width: min(300px, 40vw);
      bottom: 40px;
      z-index: 2;
      cursor: pointer;
      overflow: hidden;
      height: min(380px, 50vh);
      border-radius: 8px;
      background: white;
      box-shadow: var(--shadow);

      /* smoothness */
      transition:
        bottom 1.1s cubic-bezier(0.22, 1, 0.36, 1),
        height 1.1s cubic-bezier(0.22, 1, 0.36, 1),
        transform .28s ease;
    }

    /* Surat: fade-in saat amplop dibuka */
    .letter-fade-in {
      opacity: 0;
      transform: translateY(14px) scale(.985);
      animation: letterFadeIn .75s ease forwards;
    }

    @keyframes letterFadeIn {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* hover surat jadi 1.2x */
    .letter-container:hover {
      transform: scale(1.2);
    }

    /* ketika lagi animasi "kebuka", hover jangan ganggu */
    .letter-container.is-opening:hover {
      transform: none;
    }

    /* Transisi konten surat bolak-balik */
    .letter-content {
      width: 100%;
      position: absolute;
      top: 0;
      left: 0;
      user-select: none;
      -webkit-user-drag: none;
      transition: opacity 0.5s ease;
    }

    .letter-back {
      opacity: 0; 
    }

    .show-back .letter-front {
      opacity: 0;
    }

    .show-back .letter-back {
      opacity: 1;
    }

    /* letter slide up */
    .letter-slide-up {
      bottom: 90px;
      height: min(380px, 78vh);
      z-index: 5;
      overflow: visible;
      transform: scale(1.06);
    }

    /* =========================
       PHOTOS SECTION
    ========================= */
    .photos-section {
      min-height: 100svh;
      padding: clamp(28px, 5vw, 72px) var(--pad);
      background: linear-gradient(#0000004e, #27456199), url("bg2.jpg") no-repeat center / cover;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .section-title {
      text-align: center;
      font-family: "Great Vibes", cursive;
      font-size: clamp(2rem, 3vw, 3rem);
      margin: 0 0 clamp(10px, 3vw, 30px);
      transition: opacity .35s ease, transform .35s ease, filter .35s ease;
      will-change: opacity, transform, filter;
    }

    .photos-wrapper {
      width: min(980px, 100%);
      margin: 0 auto;
      position: relative;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr));
      gap: clamp(10px, 3vw, 40px);
      width: 100%;
      /* Batasi lebar maksimal agar aspek rasio 4/5 tidak membuat gambar terlalu tinggi ke bawah */
      max-width: 650px; 
      margin: 0 auto;
    }

    @media (max-width: 768px) {
      .photo-grid {
        grid-template-columns: 1fr;
        max-width: 320px;
        margin-inline: auto;
        gap: 40px;
      }
    }

    /* NEXT button */
    .next-btn {
      position: absolute;
      right: -12px;
      top: 50%;
      transform: translate(100%, -50%);
      border: 0;
      background: rgba(255, 255, 255, 0.92);
      color: #274561;
      font-family: "DM Sans", sans-serif;
      font-weight: 800;
      letter-spacing: .3px;
      padding: 10px 16px;
      border-radius: 999px;
      box-shadow: 0 14px 30px rgba(0, 0, 0, .35);
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease, opacity .2s ease;
      user-select: none;
      z-index: 30;
      font-size: 20px;
      line-height: 1;
    }

    .next-btn:hover {
      transform: translate(100%, -50%) scale(1.06);
      box-shadow: 0 18px 36px rgba(0, 0, 0, .45);
    }

    .next-btn:active {
      transform: translate(100%, -50%) scale(0.98);
    }

    .next-btn[disabled] {
      opacity: .55;
      cursor: not-allowed;
    }

    @media (max-width: 950px) {
      .next-btn {
        position: static;
        transform: none;
        display: block;
        margin: 22px auto 0;
      }
    }

    /* Polaroid wrapper */
    .polaroid-wrap {
      transition: transform 0.35s ease;
      position: relative;
      z-index: 1;
    }

    .polaroid-wrap:hover {
      transform: scale(1.05) rotate(0deg) !important;
      z-index: 20;
    }

    /* Card */
    .polaroid-card {
      background: white;
      padding: 15px 15px 20px 15px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      transform-style: preserve-3d;
      transition: transform 0.75s cubic-bezier(.2, .9, .2, 1);
      will-change: transform;
    }

    .img-container {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 5;
      overflow: hidden;
      background: #eee;
      border-radius: 8px;
      backface-visibility: hidden;
    }

    .img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      inset: 0;
      transition: opacity 0.55s ease-in-out, transform 0.55s ease-in-out, filter 0.55s ease-in-out;
      user-select: none;
      -webkit-user-drag: none;
      will-change: opacity, transform, filter;
    }

    .caption {
      text-align: center;
      margin-top: 14px;
      font-family: "Bellefair", serif;
      font-size: clamp(1.2rem, 3vw, 1.4rem);
      font-weight: bold;
      color: #274561;
      backface-visibility: hidden;
    }

    /* =========================
       CHOOSE SECTION (2 sealed)
    ========================= */
    .choose-grid {
      display: flex;
      gap: clamp(14px, 3vw, 28px);
      justify-content: center; /* Ubah ke center agar posisinya pas di tengah */
      align-items: center;
      width: min(900px, 94vw);
      margin-inline: auto;
    }

    @media (max-width: 768px) {
      .choose-grid {
        flex-wrap: wrap;
      }
    }

    .choose-sealed {
      border: 0;
      background: transparent;
      padding: 14px;
      border-radius: 16px;
      cursor: pointer;
      transition: transform .25s ease, box-shadow .25s ease, background .25s ease;
    }

    .choose-sealed img {
      width: min(220px, 35vw);
      height: auto;
      display: block;
      border-radius: 10px;
      box-shadow: var(--shadow);
      user-select: none;
      -webkit-user-drag: none;
    }

    .choose-sealed:hover {
      background: url("bg2.png") no-repeat center / cover;
      box-shadow: 0 18px 36px rgba(0, 0, 0, .45);
      transform: translateY(-2px) scale(1.03);
    }

    /* =========================
       SCROLL ANIMATION (Reveal)
    ========================= */
    .reveal-up {
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 0.9s ease, transform 0.9s ease;
      transition-delay: var(--d, 0s);
    }

    .reveal-up.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .reveal-fade {
      opacity: 0;
      filter: blur(10px);
      transition: opacity 0.9s ease, filter 0.9s ease;
      transition-delay: var(--d, 0s);
    }

    .reveal-fade.is-visible {
      opacity: 1;
      filter: blur(0);
    }

    .next-chapter-link {
      display: block;
      margin: 26px auto 0;
      padding: 12px 18px;
      border-radius: 999px;
      text-align: center;
      font-family: "Bellefair";
      font-weight: 800;
      letter-spacing: .2px;
      color: rgba(255, 255, 255, .95);
      text-decoration: none;
      transition: transform .2s ease, background .2s ease, box-shadow .2s ease, opacity .2s ease;
    }

    .next-chapter-link:hover {
      transform: scale(1.05);
      color: bisque;
    }

    /* A11y: hormati reduce motion */
    @media (prefers-reduced-motion: reduce) {
      .reveal-up,
      .reveal-fade,
      .sealed-img,
      .polaroid-wrap,
      .polaroid-card,
      .next-btn,
      .initial-blur,
      .letter-container,
      .img-container img,
      .section-title,
      .caption,
      .choose-sealed {
        transition: none !important;
        animation: none !important;
      }
      .reveal-up,
      .reveal-fade {
        opacity: 1 !important;
        transform: none !important;
        filter: none !important;
      }
    }
  </style>
</head>

<body>
  <audio src="Prologue.mp3" id="bg-audio" preload="auto" loop></audio>

  <!-- HERO -->
  <section class="hero-section" id="hero">
    <div class="container">

      <div id="step-sealed">
        <img src="sealed.png" class="sealed-img" alt="Amplop Tertutup" />
      </div>

      <div id="step-opened" class="envelope-assembly hidden">
        <img src="envelope-back.png" class="env-layer env-back" alt="Amplop Belakang" />

        <div id="letter-container" class="letter-container letter-fade-in" aria-label="Klik surat">
          <img src="letter.png" class="letter-content letter-front" alt="Isi Surat Depan" />
          <img src="letter-back.png" class="letter-content letter-back" alt="Isi Surat Belakang" />
        </div>

        <img src="envelope-front.png" class="env-layer env-front" alt="Amplop Depan" />
      </div>

    </div>
  </section>

  <!-- PHOTOS -->
  <section class="photos-section hidden" id="photos">
    <h2 class="section-title reveal-up" id="photos-title" style="--d:.05s">Do and Don't</h2>

    <div class="photos-wrapper">
      <div class="photo-grid">
        
        <!-- Card 1: DO -->
        <div class="reveal-fade" style="--d:.10s">
          <div class="polaroid-wrap" style="transform: rotate(-3deg);">
            <div class="polaroid-card">
              <div class="img-container">
                <img src="1.jpg" alt="Do" class="img-default">
              </div>
              <div class="caption">
                Do<br>
                <span style="font-size: 0.75em; font-weight: normal;">3S (Senyum, Santai, Swag)</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Card 2: DON'T -->
        <div class="reveal-fade" style="--d:.18s">
          <div class="polaroid-wrap" style="transform: rotate(2deg);">
            <div class="polaroid-card">
              <div class="img-container">
                <img src="2.jpg" alt="Don't" class="img-default">
              </div>
              <div class="caption">
                Don't<br>
                <span style="font-size: 0.75em; font-weight: normal;">3B (Badmood, Bete, Bersedih)</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <button class="next-btn" id="next-btn" type="button" aria-label="Next">➡️</button>
    </div>
  </section>

  <!-- CHOOSE (2 SEALED) -->
  <section class="photos-section hidden" id="choose-section"
    style="background: linear-gradient(#0000004e, #27456199), url('bg2.png') no-repeat center / cover;">
    <h2 class="section-title reveal-up">Here's some small gifts for you!</h2>

    <div class="container" style="padding: 30px 0;">
      <div class="choose-grid">
        <button class="choose-sealed" data-go="hadiah1.html" aria-label="Buka page 1">
          <img src="sealed.png" alt="Sealed 1">
        </button>
        <button class="choose-sealed" data-go="hadiah2.html" aria-label="Buka page 2">
          <img src="sealed.png" alt="Sealed 2">
        </button>
      </div>
    </div>
    <a class="next-chapter-link" href="last-chapter.html">
      Udah buka semua hadiahnya? yuk ke last chapter nih yaaa!
    </a>
  </section>
  
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const hero = document.getElementById("hero");
      const sealed = document.getElementById("step-sealed");
      const opened = document.getElementById("step-opened");
      const letter = document.getElementById("letter-container");

      const photos = document.getElementById("photos");
      const chooseSection = document.getElementById("choose-section");

      const lagu = document.getElementById("bg-audio");
      const nextBtn = document.getElementById("next-btn");

      // =========================
      // SCROLL REVEAL
      // =========================
      const revealEls = document.querySelectorAll(".reveal-up, .reveal-fade");
      const makeVisible = (el) => el.classList.add("is-visible");

      if ("IntersectionObserver" in window) {
        const io = new IntersectionObserver((entries, obs) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              makeVisible(entry.target);
              obs.unobserve(entry.target);
            }
          });
        });
        revealEls.forEach(el => io.observe(el));
      } else {
        revealEls.forEach(makeVisible);
      }

      // =========================
      // INTRO & SURAT
      // =========================
      sealed.classList.add("initial-blur");

      sealed.addEventListener("click", () => {
        sealed.classList.add("hidden");
        opened.classList.remove("hidden");
        opened.classList.add("initial-blur");

        letter.classList.remove("letter-fade-in");
        void letter.offsetWidth;
        letter.classList.add("letter-fade-in");

        setTimeout(() => {
          lagu?.play().catch(() => { });
        }, 100);
      });

      let letterStage = 0;
      let isAnimating = false;

      function goToPhotos() {
        if (letterStage === 3) return;

        hero.classList.add("fade-away");
        const onHeroFadeDone = (e) => {
          if (e.propertyName !== "opacity") return;
          hero.removeEventListener("transitionend", onHeroFadeDone);
          hero.classList.add("hidden");
        };
        hero.addEventListener("transitionend", onHeroFadeDone);

        photos.classList.remove("hidden");
        photos.classList.remove("initial-blur");
        void photos.offsetWidth; 

        requestAnimationFrame(() => {
          photos.classList.add("initial-blur-photos");
        });

        document.querySelectorAll("#photos .reveal-up, #photos .reveal-fade").forEach(el => {
          el.classList.add("is-visible");
        });

        letterStage = 3;
      }

      letter.addEventListener("click", () => {
        if (isAnimating) return;

        // Stage 0: Tarik surat
        if (letterStage === 0) {
          isAnimating = true;

          letter.classList.add("is-opening");
          letter.classList.add("letter-slide-up");
          opened.classList.add("env-drop");

          const onLetterDone = (e) => {
            if (e.propertyName !== "bottom") return;
            letter.removeEventListener("transitionend", onLetterDone);
            isAnimating = false;
            letterStage = 1;
            letter.classList.remove("is-opening");
          };
          letter.addEventListener("transitionend", onLetterDone);
          return;
        }

        // Stage 1: Putar/Fade ke belakang surat
        if (letterStage === 1) {
          letter.classList.add("show-back");
          letterStage = 2;
          return;
        }

        // Stage 2: Lanjut ke foto
        if (letterStage === 2) {
          setTimeout(() => { goToPhotos() }, 200);
        }
      });

      // =========================
      // PHOTOS -> CHOOSE (Hadiah)
      // =========================
      function transitionToChoose() {
        photos.classList.add("fade-away");

        setTimeout(() => {
          photos.classList.add("hidden");

          chooseSection.classList.remove("hidden");
          chooseSection.classList.add("initial-blur");

          chooseSection.querySelectorAll(".reveal-up, .reveal-fade").forEach(el => {
            el.classList.add("is-visible");
          });

          setTimeout(() => {
            chooseSection.classList.remove("initial-blur");
          }, 350);
        }, 600);
      }

      nextBtn?.addEventListener("click", () => {
        nextBtn.disabled = true;
        transitionToChoose();
      });

      // =========================
      // CHOOSE LINKS
      // =========================
      document.querySelectorAll(".choose-sealed").forEach(btn => {
        btn.addEventListener("click", () => {
          const to = btn.dataset.go;
          if (!to) return;
          window.open(to, "_blank", "noopener,noreferrer");
        });
      });
    });
  </script>
</body>

</html>
